version: 2

models:
  - name: stg_companies
    description: "Référentiel des sociétés cotées à la BRVM."
    columns:
      - name: company_id
        description: "Identifiant unique de la société."
        data_tests:
          - not_null
          - unique

      - name: symbol
        description: "Symbole boursier de la société."
        data_tests:
          - not_null
          - unique

      - name: company_name
        description: "Nom de la société."
        data_tests:
          - not_null