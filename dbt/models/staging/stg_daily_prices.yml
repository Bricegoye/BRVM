version: 2

models:
  - name: stg_daily_prices
    description: "Vue de préparation des cotations quotidiennes BRVM."

    columns:
      - name: price_id
        description: "Identifiant unique de la cotation."
        data_tests:
          - not_null
          - unique

      - name: company_id
        description: "Identifiant de la société."
        data_tests:
          - not_null

      - name: trade_date
        description: "Date de la séance boursière."
        data_tests:
          - not_null

      - name: close_price
        description: "Cours de clôture."
        data_tests:
          - not_null