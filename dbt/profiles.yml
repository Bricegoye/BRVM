brvm_analytics:
  target: dev

  outputs:
    dev:
      type: postgres

      host: "{{ env_var('DATABASE_HOST') }}"
      port: "{{ env_var('DATABASE_PORT') | int }}"
      user: "{{ env_var('DATABASE_USER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_DATABASE_PASSWORD') }}"
      dbname: "{{ env_var('DATABASE_NAME') }}"

      schema: brvm_dbt_dev
      threads: 1
      connect_timeout: 10
      sslmode: require