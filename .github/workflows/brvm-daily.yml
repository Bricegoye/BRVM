name: BRVM Daily Collector

on:
  # Lancement automatique du lundi au vendredi à 18h45 UTC
  schedule:
    - cron: "45 18 * * 1-5"

  # Permet également de lancer le collecteur manuellement
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      BRVM_BASE_URL: https://www.brvm.org
      BRVM_MARKET_URL: https://www.brvm.org/fr/cours-actions/officiel

      DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BRVM collector
        run: python main.py