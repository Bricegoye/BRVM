name: BRVM Daily Collector

on:
  # Lancement automatique du lundi au vendredi à 18h45 UTC
  schedule:
    - cron: "45 18 * * 1-5"

  # Lancement manuel depuis GitHub
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brvm-daily-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BRVM_BASE_URL: https://www.brvm.org
      BRVM_MARKET_URL: https://www.brvm.org/fr/cours-actions/officiel

      DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build collector image
        run: docker build -t brvm-collector:ci .

      - name: Run BRVM collector
        run: |
          docker run --rm \
            --env BRVM_BASE_URL \
            --env BRVM_MARKET_URL \
            --env DATABASE_HOST \
            --env DATABASE_PORT \
            --env DATABASE_NAME \
            --env DATABASE_USER \
            --env DATABASE_PASSWORD \
            brvm-collector:ci